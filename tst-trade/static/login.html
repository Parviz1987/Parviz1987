<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TST Trade · Giriş</title><link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f1317">
<link rel="icon" href="/static/icons/fav-64.png"><link rel="apple-touch-icon" href="/static/icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TST Trade">
</head><body>
<form class="login" method="post" action="/login">
  <div class="brand">TST <b>Trade</b></div>
  <label for="pw">Parol</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <label class="note"><input type="checkbox" id="show"> Parolu göstər</label>
  <p class="note" id="err" hidden>Parol səhvdir. Klaviaturanın dilini yoxlayın (AZ / RU / EN) və «Parolu göstər» ilə baxın.</p>
  <button class="btn pri" type="submit">Daxil ol</button>
</form>
<script>if(location.search.includes("e=1"))document.getElementById("err").hidden=false;
document.getElementById("show").onchange=(e)=>{document.getElementById("pw").type=e.target.checked?"text":"password";};</script>
</body></html>
