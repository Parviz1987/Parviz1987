<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TST Trade · Texniki analiz</title><link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f1317">
<link rel="icon" href="/static/icons/fav-64.png"><link rel="apple-touch-icon" href="/static/icons/apple-180.png">
</head><body>
<header class="top">
  <div class="brand">TST <b>Trade</b> · Texniki analiz bloku</div><span class="sp"></span>
  <span class="clock" id="upd"></span>
<nav class="mainnav" id="mainnav" aria-label="Səhifələr"></nav>
</header>
<main class="wrap res ta">
  <section class="box">
    <h2>Qrafik <span class="sp"></span>
      <span class="seg" id="sym"></span><span class="seg" id="tf"></span><span class="seg" id="cnt"></span>
      <button class="tabtn" id="big" title="Böyük pəncərə">⛶ Böyüt</button></h2>
    <div class="tachart" id="wrapc">
      <canvas id="cv" aria-label="Şam qrafiki və texniki analiz qatları"></canvas>
      <div class="tip mono" id="tip"></div>
      <button class="tabtn tclose" id="small" title="Kiçilt">✕ Kiçilt</button>
    </div>
    <div class="talayers" id="layers"></div>
    <p class="note">Hər qat və hər qayda ayrıca yandırılıb-söndürülür. ▲ / ▼ — qaydanın həmin şamda verdiyi siqnal (üstünə gələndə adı
      görünür). Hamısı bir blokdan gəlir: kod qrafikdə tapır, Hakim hər qaydanı ayrıca ölçür.</p>
  </section>
  <section class="box"><h2>Bu çərçivədə blok nə deyir <span class="sp"></span><span class="note" id="nowt"></span></h2>
    <div id="now"></div></section>
  <section class="box"><h2>Qaydalar <span class="sp"></span>
      <button class="tabtn" id="allon">Hamısı</button><button class="tabtn" id="alloff">Heç biri</button></h2>
    <div id="book"></div></section>
</main>
<script src="/static/chart.js"></script>
<script src="/static/ta.js"></script>
<script src="/static/nav.js"></script>
</body></html>
